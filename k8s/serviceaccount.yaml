# ServiceAccount del microservicio de sucesos con IRSA (T048).
#
# Su `deployment.yaml` ya fijaba `serviceAccountName: events`, pero el objeto
# ServiceAccount no existía en ningún repo: Kubernetes rechaza el pod con
# `serviceaccount "events" not found`. Se descubrió al revisar T085, que
# daba esta pieza por hecha.
#
# `iam.tf` restringe el rol a `system:serviceaccount:default:events` y su
# política sólo toca `life-simulator-mvp-events-cache`, así que el nombre
# tiene que ser exactamente `events` en el namespace `default`.
#
# El ARN sale de `terraform output -json irsa_role_arn` → `.events`.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: events
  labels:
    app: events
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::000000000000:role/life-simulator-mvp-events-irsa
